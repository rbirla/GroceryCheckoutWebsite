{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image_url }}" class="img-fluid rounded" alt="{{ product.name }}">
    </div>
    <div class="col-md-6">
        <h2>{{ product.name }}</h2>
        <p class="text-success h4">${{ '%.2f' | format(product.price) }}</p>
        <p><strong>Category:</strong> {{ product.category }}</p>
        <p><strong>Stock left:</strong> {{ product.stock or 'N/A' }}</p>
        <p><strong>Description:</strong> Coming soon...</p>
        <a href="/products" class="btn btn-outline-secondary mt-3">← Back to Products</a>
    </div>
</div>
{% endblock %}
