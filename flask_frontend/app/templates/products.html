<!DOCTYPE html>
<html>
<head>
    <title>LocalHarvest - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">

    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <a class="navbar-brand" href="/">LocalHarvest</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/products">Products</a>
            <a class="nav-link" href="/about">About</a>
        </div>
    </nav>

    <h1 class="mb-4">Our Products</h1>

    <form class="mb-4">
        <input type="text" class="form-control" placeholder="Search for fruits, veggies, or dairy...">
    </form>

    <div class="row">
        {% for item in items %}
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">{{ item.price }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <footer class="text-center mt-5 mb-3 text-muted">
        <small>© 2025 LocalHarvest. Built by Team 9 – BTP405 Winter Project.</small>
    </footer>

</body>
</html>
