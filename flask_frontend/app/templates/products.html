{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
<h1 class="mb-4">Our Products</h1>

<form class="mb-4">
    <input type="text" class="form-control" placeholder="Search for fruits, veggies, or dairy...">
</form>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
    {% for item in items %}
    <div class="col d-flex align-items-stretch">
        <div class="card shadow-sm w-100">
            <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.name }}">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ item.name }}</h5>
                <p class="card-text text-success fw-bold">${{ '%.2f' | format(item.price) }}</p>
                {% if item.stock %}
                <p class="card-text text-muted">Stock: {{ item.stock }}</p>
                {% endif %}
                <a href="{{ url_for('routes.product_detail', product_id=item.id) }}" class="btn btn-success mt-auto">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
