<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - LocalHarvest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <a class="navbar-brand" href="/">LocalHarvest</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('routes.index') }}">Home</a>
            <a class="nav-link" href="{{ url_for('routes.products') }}">Products</a>
            <a class="nav-link" href="{{ url_for('routes.about') }}">About</a>
            {% if current_user.is_authenticated %}
            <a class="nav-link" href="{{ url_for('routes.dashboard') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('routes.logout') }}">Logout</a>
            {% else %}
            <a class="nav-link" href="{{ url_for('routes.login') }}">Login</a>
            <a class="nav-link" href="{{ url_for('routes.register') }}">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
