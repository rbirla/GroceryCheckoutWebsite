<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LocalHarvest{% endblock %} - LocalHarvest</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('routes.index') }}">LocalHarvest</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('routes.index') }}">Home</a>
                <a class="nav-link" href="{{ url_for('routes.products') }}">Products</a>
                <a class="nav-link" href="{{ url_for('routes.about') }}">About</a>
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="{{ url_for('routes.dashboard') }}">Dashboard</a>
                    <a class="nav-link" href="{{ url_for('routes.logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('routes.login') }}">Login</a>
                    <a class="nav-link" href="{{ url_for('routes.register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 mb-3 text-muted">
        <small>© 2025 LocalHarvest. Built by Team 9 – BTP405 Winter Project.</small>
    </footer>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
